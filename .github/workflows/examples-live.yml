name: examples-live
# The example projects against the staging API. Staging jobs run on the
# production fleet and bill, so this runs on demand and once a week, not per PR.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
concurrency:
  group: examples-live
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rendobar/openapi
          path: .openapi  # for the shared webhook vectors
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node examples/run.mjs --mode live
        env:
          RENDOBAR_API_URL: ${{ secrets.RENDOBAR_STAGING_API_URL }}
          RENDOBAR_API_KEY: ${{ secrets.RENDOBAR_STAGING_API_KEY }}
