name: release
# release-please opens one release PR per package. Nothing publishes until a
# person merges it. Publishing uses npm trusted publishing: no stored token.
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.rp.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  publish:
    needs: release-please
    if: needs.release-please.outputs.releases != '[]' && needs.release-please.outputs.releases != ''
    runs-on: ubuntu-latest
    environment: npm
    strategy:
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.releases) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm publish --provenance --access public
        working-directory: ${{ matrix.path }}
